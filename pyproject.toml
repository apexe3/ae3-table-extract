[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ae3-table-extract"
version = "0.2.0"
description = "Open-source table extraction from images: ONNX table-structure model + Tesseract OCR"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Team APEX:E3"}]
keywords = ["tables", "table-extraction", "ocr", "onnx", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "pillow>=10.0",
    "httpx>=0.27",
    "tabulate>=0.9",
    "defusedxml>=0.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.20"]
dev = ["pytest>=8.0"]

[project.scripts]
ae3-tl = "ae3_tl.serve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
