[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ae3-tl"
version = "0.2.0"
description = "AE3-TL: tables out of a page image, and out of a PDF"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.txt" }
authors = [{ name = "Team APEX:E3" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "onnxruntime==1.23.2",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "pillow==13.0.0",
  "numpy==2.3.2",
  "httpx==0.28.1",
  "pypdfium2==5.14.0",
  "pdfplumber==0.11.10",
  "defusedxml==0.7.1",
]

[project.scripts]
ae3-tl = "ae3_tl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ae3_tl"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE.txt", "THIRD_PARTY_NOTICES.md"]
